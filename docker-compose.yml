# ADM-auditkit 容器 —— 部署到 NAS，给 DeepSeek 等 AI agent 调用的审计工具
# 遵循 NAS 开发规范：
#   §6.1 端口绑 192.168.2.200，禁 0.0.0.0
#   §2-7 restart 退避（on-failure:3），不 unless-stopped 猛拉（防 trim 死锁）
services:
  auditkit:
    build: .
    container_name: auditkit
    restart: "on-failure:3"
    volumes:
      - /vol1/1000/docker/ADM-auditkit:/app                # 框架可写（产物落 projects/）
      - /vol1/1000/docker/autoforge:/data/workspace/audit/src:ro    # AutoForge
      - /vol1/1000/docker/doubao-butler:/data/workspace/repos/doubao-butler:ro
      - /vol1/1000/docker/memory-agent:/data/workspace/repos/memory-agent:ro
      - audit-out:/audit-out                                  # findings/报告落这里
    environment:
      - TZ=Asia/Shanghai
    # 常驻容器，用 docker exec 跑命令
    command: ["tail", "-f", "/dev/null"]

volumes:
  audit-out:
