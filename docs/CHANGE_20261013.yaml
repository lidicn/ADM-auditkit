proposal_id: 20261013-family-level-repair
title: "从『点级修复』到『族级修复』：规则逐条报 ⇒ 修一个点，同族其他点原样留下"
date: 2026-10-13
author: "ADM 规则审计 agent（memory-agent 第三期，20 轮）"
target_repo: lidicn/ADM-auditkit
type: workflow
severity_note: >
  本提案不新增规则，全部是**产出形态与审计流程修正**。核心论点：
  现有规则的输入是单个 AST 节点、输出是「这条命中是不是缺陷」，
  于是修复必然是「哪里报了补哪里」。而缺陷是成族出现的——
  本期四次族内清点，报出的站点数分别是族内真实规模的 25% / 40% / 0%（时钟族规则一条没报）。
  附跨项目横向对照：同一作者三个项目共 60 轮，**每个项目都有一个占近半的根因族**。

recommendations:
  - id: R1
    title: "规则输出增加『族』维度：family_key + 族级清点成为必填项"
    body: >
      不改单条判据，改产出的聚合方式。每条命中带 family_key（同族共享的规范化模式签名），
      报告层按 family_key 聚合，输出「总站点数 / 已修 / 未修 / 明确不该修 / 未判定」。
      任何确证缺陷，必须回答「同族还有几处」。
      证据：MA36 报 2 处、族内清点 8 处（修了 25%）；而族里不该修的几处
      （reserve_idempotency 的 docstring 明写判定全在同一把锁同一连接内完成，
      改成单事务反而会让「第二并发者 → in_flight」失效）只有做族级清点才看得出。
      反例：MA44/MA45 清点后把「要不要改 _read_skill_meta 返回契约（影响 5 处）」
      收敛成「不用改，只需 2 处本地探测」。
      **点级修复既会漏修，也会误修。**
    evidence: ["MA36（2 vs 8）", "MA44/MA45（5 调用点中 2 破坏性/1 误报/2 fail-loud）", "MA30（规则 0 命中、族内 33 处）", "scan_rebuild.py", "scan_del.py"]
    action: >
      把本期四次族内清点用的定向扫描脚本模式固化为「给定 family_key 列出全部站点」的通用能力；
      报告模板增加族级清点小节

  - id: R2
    title: "补丁复测必须是独立轮次，不是顺手做"
    body: >
      本期三类产物失效，全部表现为「看起来已修」：
      ① 补丁被覆盖——第 9 轮 ha_client.close 的 exception=... ，两个编辑作用于同一处，
      后者覆盖前者，不报错；② 产物虚构——第 11 轮 MA27/MA31/MA35 被审对象在原仓库
      grep 零命中，撤回率 21%，其中 MA27 还配了「作者 docstring 白纸黑字」的引用；
      ③ 发现未登记——MA39/MA39b 的真实出站面，护栏早就在补丁副本里打好了，台账里却没有条目。
      第 20 轮重跑全部 19 个缺陷的 PoC：18 个补丁仍生效、1 个未修（MA40b）、2 个 latent 未修。
      不做这一轮，三类失效一个都不会被发现。
    evidence: ["r20_recheck.json（19 项逐条）", "ha_client.py", "MA27/MA31/MA35 撤回记录"]
    action: >
      20 轮协议的最后一轮固定为补丁复测轮；复测必须重跑 PoC 而非只 grep 补丁标记注释
      （标记是注释，代码被覆盖时标记仍在）

  - id: R3
    title: "『补上缺失的读取/校验』类补丁，必须同时覆盖成功与失败分支"
    body: >
      本期第 4 次：MA-26 修了「版本基数从不读盘」，没修「读了但读失败」⇒ MA45；
      同类还有 DB36（commit 护栏没管 commit() 自己抛）、AF20（try 只包住 json.load，
      没包住字段级 canary.load()）、第 14 轮 MA40 第一版补丁只加 integrity_check
      差点把最后一丝数据抹掉。
      共同形状：修复补的是 happy path 上缺的那一环，失败分支仍走旧路径。
    evidence: ["MA45", "MA-26", "MA40", "DB36", "AF20"]
    action: >
      补丁 lint：凡新增「读取/校验」调用，强制检查其失败分支是否也被处理；
      抽查用例必须包含「读取成功但内容异常」与「读取抛异常」两类

  - id: R4
    title: "撤回 ≠ 风险不存在：撤回必须触发『回到原仓库找真实站点』"
    body: >
      第 11 轮撤回 MA27/MA31 后，我没回到原仓库问「那么真实的出站面在哪」，
      导致三重矛盾状态持续两轮：报告描述的对象不存在（已撤回）、
      真实的两处 SSRF 从未登记、而补丁副本里护栏其实早就打好了。
      第 13 轮才补上 MA39/MA39b。撤回只做了「符号不存在 ⇒ 撤回」这一层判定。
      反推真实入口的线索恰恰是补丁副本的 3 个接线点——护栏存在 ⇒
      当初一定看到了某个真问题，台账里却没有条目，说明登记环节漏了。
    evidence: ["MA27", "MA31", "MA39", "MA39b"]
    action: >
      撤回流程增加强制步骤：在原仓库内枚举同类 sink 的全量调用点，
      确认是否存在真实站点；结果写进同一条台账记录的 retracted_in_round 字段

  - id: R5
    title: "PoC 摘要必须按代码版本分别汇总，且隔离对照优先于端到端"
    body: >
      两个真实反例：① poc_ma36.py 末尾摘要把两份代码混计成「总用例 12，失败 2」，
      那 2 个 FAIL 是原仓库侧、正是缺陷成立的表现，只读末尾摘要会得出「补丁失败」的相反结论；
      ② poc_ma43_c.py（端到端）显示补丁副本读等待 0.410s > 原仓库 0.207s，看起来补丁更差，
      而隔离对照 poc_ma43.py 显示 0.380s → 0.004s——端到端口径里 VACUUM 那 0.38s
      被分批 DELETE 自身停顿盖住了。
    evidence: ["poc_ma36.py", "poc_ma43.py", "poc_ma43_c.py"]
    action: >
      PoC 模板：结果按 (代码版本, 用例) 二维汇总，禁止跨版本混计；
      凡同时存在端到端与隔离对照口径的，以隔离对照为准，端到端结论需注明口径

  - id: R6
    title: "维护『项目级根因族画像』，新项目开审时前置查阅"
    body: >
      跨项目横向对照（60 轮）：AutoForge 最大族「读失败被当成没有数据」9/20（45%）；
      doubao-butler 最大族「护栏装在入口、漏接第 N+1 个」9/20（45%）；
      memory-agent 最大族「失败被当成没问题」8/19（42%）。
      AutoForge 的 9 与 memory-agent 的 8 是同一族 ⇒ 同一作者跨两个项目共 17 项。
      而 doubao-butler 的最大族不同，说明族分布是项目/作者习惯的函数、不是随机噪声 ⇒ 可预测、可前置。
    evidence: ["AutoForge 第二期全本", "doubao-butler 第三期全本", "memory-agent 第三期台账"]
    action: >
      基线库增加 family_profile 段（project/author/family_key/站点数/已修/未修/不该修/判据修正）；
      新项目首轮按同作者画像排序定向专题

new_gaps:
  - id: gap-20
    title: "规则逐条报告、不做族级聚合"
    desc: >
      修一个点，同族其他点原样留下。MA36 报 2 处、族内 8 处，修了 25%；
      时钟族规则一条没报，靠人工扫 time.time() 才找到 33 处
  - id: gap-21
    title: "补丁复测无强制流程"
    desc: >
      补丁可被后续编辑覆盖且不报错（ha_client.close）；产物可虚构（三条撤回，21%）；
      发现可漏登记（MA39/MA39b 护栏在、台账无条目）
  - id: gap-22
    title: "PoC 摘要混计两份代码 / 端到端掩盖隔离对照"
    desc: >
      poc_ma36 的「失败 2」其实是缺陷成立；poc_ma43_c 与 poc_ma43 结论相反

