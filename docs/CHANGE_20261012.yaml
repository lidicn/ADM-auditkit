proposal_id: 20261012-guardrail-wiring
title: "护栏的接线位置决定它是否有效：从『入口级接线』下沉到『共享层接线』"
date: 2026-10-12
author: "ADM 规则审计 agent（doubao-butler 第三期，20 轮）"
target_repo: lidicn/ADM-auditkit
type: workflow
severity_note: >
  本提案不新增规则，全部是**判据与审计流程修正**。核心论点：本期 20 轮确证的
  20 项缺陷里，有 9 项（近一半）根因相同——**安全机制被实现在"每个调用入口"
  而不是"被保护资源自身"**，于是每新增一个入口就多一次漏接机会。项目里恰好
  自带反例（DB23 护栏装在 system_run 自身 ⇒ 从未漏接），可同项目对照。

recommendations:
  - id: R1
    title: "审计时先问『这个护栏装在哪一层』，再问『它有没有被绕过』"
    body: >
      当前规则的提问顺序是"有没有护栏 / 护栏是否被调用"，这只能发现"完全没有"
      和"装了没接线"两类。第三期 9 项同族缺陷说明，还应该问第三层：
      **它装在被保护资源自身（共享层），还是装在每个调用入口？**
      前者新增调用方自动受保护；后者每加一个入口就要记得接一次。
      DB28（HAWhitelist 装在工具层，技能引擎层未接线）与
      DB30（runner.run 四道门，agent 直调引擎绕过）是同一根因的两次兑现。
    evidence: ["DB23（反例：装在共享层，从未漏接）", "DB24", "DB26", "DB27", "DB28", "DB30", "DB31", "DB34", "DB36"]
    action: >
      新增判据：识别"被保护资源（写盘/执行/鉴权/网络出口）"与其"护栏调用点"，
      统计护栏是位于资源自身还是位于各调用方；后者标为 wiring_risk 并列出已知入口清单

  - id: R2
    title: "拒绝型规则必须同时跑『危险输入被拦』与『合法输入被放行』两组用例"
    body: >
      这是本期最反直觉的一条。skills/quarantine.check_security 是安全门，
      19 轮以来我一直在问"它能不能拦住危险技能"（答案：拦不住，4/4 绕过），
      从没问过"它会不会拦住合法技能"。
      实测后者：对**整个技能 JSON** 做子串黑名单，裸词 "format" 在名单内 ⇒
      prompt 里一句 "Format the reply as one line" 就把合法技能打成安全违规，
      并**持久化 status=quarantined, enabled=false**。合法放行率 1/5。
      危害不对称：漏报是"少一层本就不牢的防线"；错杀是"技能持久化停用 + 重启后无自愈"。
      更隐蔽的是：仓库 8 个 BUILTIN_TEMPLATES 恰好全部避开了 "format" 这个词 ⇒
      **只在测试集上验证、测试集恰好避开触发词**，误伤只会在 LLM 生成的技能上暴露。
    evidence: ["DB53", "poc_db53.py"]
    action: >
      对每一条"拒绝型"规则（安全门/校验/护栏）配一组 negative-fixture：
      合法输入必须放行。缺此用例的规则不许标 verified

  - id: R3
    title: "『不可达』结论必须自带『试过哪些源』清单"
    body: >
      前 13 轮我判依赖 CVE"不可达"，依据是 PyPI 与 OSV 返回 403。
      第十四轮试了第四个源（api.github.com/advisories，GHSA）⇒ HTTP 200，
      一次拿到 39 条带版本区间的命中（24 HIGH）。
      一行 urlopen 就能验证的事，我做了 14 轮才做。
      "只有一句 PyPI 403 的不可达"和"试过 PyPI/OSV/NVD/GHSA 之后仍不可达"，
      对决策者是完全不同的信息量。
    evidence: ["DB46", "W157 ghsa_scan.py"]
    action: >
      任何"不可达/无法验证"结论，落盘时必须附 tried_sources 列表与各自 HTTP 状态；
      缺该字段的不可达结论不进最终报告

  - id: R4
    title: "覆盖面自检第一步是 import 图能否闭合，而不是『跑了哪些规则』"
    body: >
      第十八轮发现三个被 import 但源码不在仓库内的模块（butler.tts.manager/singleton、
      butler.core.user_location、butler.core.ha_client）。其中 butler/tts/** 被
      .gitignore 的 `tts/` 排除 ⇒ **17 轮、28 个分析器，没有任何一条命中落在 TTS 子系统上**。
      我以前的覆盖盲区轮次查的都是"树内的洞"（某规则族没跑、某文件没看），
      这次是"树本身缺了一块"。而我一直把"扫描树 = 代码全集"当默认，从没检验过。
    evidence: ["DB51", "poc_db50d.py"]
    action: >
      scan 前置强制检查：解析全量 import，凡无法在扫描树内解析的一律报 missing_module，
      禁止静默跳过

  - id: R5
    title: "引用历史命中数前，必须确认它是在哪一代工具/判据下产生的"
    body: >
      本期四次踩到：第七轮 AFS-03 报 31 条，过滤后生产仅 4 处；第十五轮 RSC-02
      用 round-001 旧数据；第十七轮 RSC-03 报 190 条 → 生产 8 条 → 真实 0 条；
      第十九轮 MIXED-RETURN 131 → 75。这些数字都产生于 W152 排除清单、
      W129 判据落地**之前**，工具修好后**旧数据不会自动变干净**。
      后果是拿 190 条的恐慌去做 8 条的事。
    evidence: ["W152", "W129", "DB-FP-017"]
    action: "每条命中记录带 scan_id / tool_rev 字段；报告引用历史数字时必须注明代数"

  - id: R6
    title: "补丁改了数据基准时，必须检查该字段的其他写入路径"
    body: >
      第二十轮我把 _quarantined_at 改成单调时钟，而 store.quarantine() 仍在用
      time.strftime 写墙上时钟 ISO 串 —— 两者混用会让 24h 比较完全失真。
      这是"修 A 引入 B"的教科书形状：同一份数据有两条写入路径，只改了一条的基准。
      与 M23（护栏被 except: pass 吞）、AF1（补丁用未定义的名）、
      _secrets 未导入同一族——**失效源是我自己的补丁，且不报错**。
    evidence: ["DB54", "M23", "AF1"]
    action: >
      补丁 lint 增加"同一字段多写入点"检查；改时间基准/单位/编码时强制列出该字段所有写入点

new_gaps:
  - id: gap-14
    title: "扫描树 ≠ 代码全集：缺少 import 图闭合检查"
    desc: >
      覆盖盲区自检一直查"树内的洞"，没查"树本身缺一块"。被 .gitignore 排除的
      butler/tts/** 从未进入扫描树，17 轮零命中，而它是核心功能且启动时顶层 import
  - id: gap-15
    title: "拒绝型规则缺少『合法输入必须放行』的负向用例"
    desc: >
      现有判据只评估"危险输入被拦"。安全门误伤率高的情况（DB53 合法放行率 1/5）
      在只跑正向用例时看起来"很有用"
  - id: gap-16
    title: "『不可达』结论缺少 tried_sources 清单"
    desc: >
      判 CVE 不可达只试了 PyPI/OSV 就下结论，漏掉实测 200 的 GHSA，盲区多存续 13 轮

notes_for_maintainer: >
  本包在沙箱内生成，未能获取 RULE_AUTHORING_GUIDE.md 原文（GitHub 与 raw 均不可达），
  字段格式照 20261011 已落盘提案手工生成。本地非 git 仓库、无 rules/propose 子命令，
  故无 changes.patch 与 rules_list.txt。所有证据均可用包内附的 poc_*.py 脚本复现。
