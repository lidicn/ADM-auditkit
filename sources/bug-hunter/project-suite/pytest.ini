[pytest]
# 项目原先没有任何 pytest 配置 —— 这是 10 个 async 测试在全新 checkout 下
# 必然报 "async def functions are not natively supported" 的唯一原因（见第二轮审计 N-4）。
# asyncio_mode=auto 让 async def 测试无需逐条加 @pytest.mark.asyncio。
asyncio_mode = auto

testpaths = tests

# 不写全名也能选中：pytest -m bug_repro / -m countermeasure
markers =
    bug_repro: 正测——断言缺陷行为成立；失败即「已修复」或「桩件失效」，需人工判定
    countermeasure: 反测——注入修复方案后行为必须恢复正常，常驻回归防线
    isolated: 需进程隔离（该用例与既有测试存在未定位的跨测试污染，默认跳过）

# 审计用例会打桩改写模块属性，顺序随机可能相互污染；按文件顺序跑更可复现
addopts = -p no:randomly --tb=short
